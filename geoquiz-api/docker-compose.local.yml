# Local Docker hot-reload: Postgres + Go Air API + Vite WebUI (bind mounts).
# Usage: docker compose -f docker-compose.local.yml -p geoquiz up -d --force-recreate
name: geoquiz
services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: geoquiz
      POSTGRES_PASSWORD: geoquiz
      POSTGRES_DB: geoquiz
    ports:
      - "5436:5432"
    volumes:
      - geoquiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoquiz -d geoquiz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: golang:1.25-alpine
    restart: "no"
    working_dir: /app
    environment:
      ADDR: "0.0.0.0:8080"
      DATABASE_URL: postgres://geoquiz:geoquiz@postgres:5432/geoquiz?sslmode=disable
      JWT_SECRET: change-me-geoquiz-jwt
      CORS_ORIGINS: http://localhost:5179,http://127.0.0.1:5179,http://localhost:5173,http://127.0.0.1:5173
      GIN_MODE: debug
      GOTOOLCHAIN: auto
    command:
      - sh
      - -c
      - apk add --no-cache git gcc musl-dev && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - geoquiz-gomod:/go/pkg/mod
      - geoquiz-gotmp:/app/tmp
      - geoquiz-uploads:/app/uploads
    ports:
      - "8177:8080"
    depends_on:
      postgres:
        condition: service_healthy

  webui:
    image: node:22-alpine
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: "/geoquiz/"
      VITE_HMR_CLIENT_PORT: "80"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://api:8080
    command:
      - sh
      - -c
      - rm -rf /app/node_modules/* /app/node_modules/.[!.]* 2>/dev/null; npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../geoquiz-webui:/app
      - geoquiz-webui-node-modules:/app/node_modules
    ports:
      - "5179:5173"
    networks:
      - default
      - pc-armin-local
    depends_on:
      - api

volumes:
  geoquiz-postgres-data:
  geoquiz-gomod:
  geoquiz-gotmp:
  geoquiz-uploads:
  geoquiz-webui-node-modules:

networks:
  pc-armin-local:
    external: true
